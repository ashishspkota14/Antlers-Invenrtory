# Pings Supabase every 3 days so the free project never pauses for inactivity.
# Needs repo secrets: SUPABASE_URL and SUPABASE_KEY (the publishable / anon key).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days, ~8 AM Colorado time
  workflow_dispatch: {}        # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
